# ═══════════════════════════════════════════════════════
#  IoT IDS Platform — Production Docker Compose
#
#  Usage:
#    docker compose up -d                  # Core stack (nginx, backend, attack_engine, postgres, redis)
#    docker compose --profile fl up -d     # Core + FL server (clients are dynamic)
# ═══════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════
  #  1. PostgreSQL Database
  # ═══════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: iot_ids_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iot_ids}
      POSTGRES_USER: ${POSTGRES_USER:-iot_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_secure_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_admin} -d ${POSTGRES_DB:-iot_ids}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════
  #  2. Redis Cache / Pub-Sub
  # ═══════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: iot_ids_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════
  #  3. FastAPI Backend
  # ═══════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iot_ids_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    volumes:
      - ./model:/app/models:ro
      - ./data/clients:/app/client_data:rw
      - ./data/scenarios:/app/scenarios:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ═══════════════════════════════════════════════
  #  4. Attack Engine (Scapy-based traffic generator)
  # ═══════════════════════════════════════════════
  attack_engine:
    build:
      context: ./attack_engine
      dockerfile: Dockerfile
    container_name: iot_ids_attack_engine
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

  # ═══════════════════════════════════════════════
  #  5. Nginx — serves frontend + proxies API/WS
  # ═══════════════════════════════════════════════
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iot_ids_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # ═══════════════════════════════════════════════
  #  6. Flower FL Server (profile: fl)
  # ═══════════════════════════════════════════════
  fl_server:
    build:
      context: ./fl_server
      dockerfile: Dockerfile
    container_name: iot_ids_fl_server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ROUNDS: ${FL_ROUNDS:-5}
      MIN_CLIENTS: ${FL_MIN_CLIENTS:-2}
      USE_HE: ${FL_USE_HE:-true}
      FL_TLS_CERT: /app/certs/server.crt
      FL_TLS_KEY: /app/certs/server.key
      FL_TLS_CA: /app/certs/ca.crt
      CLIENT_KEY_DIR: /app/certs/client_keys/
    volumes:
      - ./fl_server:/app
      - ./fl_common:/fl_common
      - ./model:/app/models
      - ./certs:/app/certs:ro
    depends_on:
      - backend
    profiles:
      - fl

  # FL clients are started dynamically by backend/app/services/docker_service.py
  # based on DB/canvas registrations. Static FL client services
  # are intentionally removed.

volumes:
  pgdata:
    driver: local

networks:
  default:
    name: iot_ids_network
