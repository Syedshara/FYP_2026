services:
  # ═══════════════════════════════════════════════
  #  1. PostgreSQL Database
  # ═══════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: iot_ids_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iot_ids}
      POSTGRES_USER: ${POSTGRES_USER:-iot_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_secure_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_admin} -d ${POSTGRES_DB:-iot_ids}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════
  #  2. Redis Cache / Pub-Sub / Celery Broker
  # ═══════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: iot_ids_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════
  #  3. FastAPI Backend
  # ═══════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iot_ids_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT:-.}
    volumes:
      - ./backend:/app                   # Hot-reload source code
      - ./model:/app/models              # Model .pt + .pkl files
      - ./datasets:/app/datasets:ro      # CIC-IDS2017 CSV files (read-only)
      - ./data/clients:/app/client_data:rw  # Read-write: backend generates data for new clients
      - ./data/scenarios:/app/scenarios:ro   # Scenario packs for simulation
      - /var/run/docker.sock:/var/run/docker.sock   # Docker SDK
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ═══════════════════════════════════════════════
  #  4. Flower FL Server
  # ═══════════════════════════════════════════════
  fl_server:
    build:
      context: ./fl_server
      dockerfile: Dockerfile
    container_name: iot_ids_fl_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      ROUNDS: ${FL_ROUNDS:-5}
      MIN_CLIENTS: ${FL_MIN_CLIENTS:-2}
      USE_HE: ${FL_USE_HE:-true}
      # Phase 2 — mTLS server credentials
      FL_TLS_CERT: /app/certs/server.crt
      FL_TLS_KEY: /app/certs/server.key
      FL_TLS_CA: /app/certs/ca.crt
      # Phase 2 — client Ed25519 public keys for gradient signature verification
      CLIENT_KEY_DIR: /app/certs/client_keys/
    volumes:
      - ./fl_server:/app
      - ./fl_common:/fl_common
      - ./model:/app/models
      - ./certs:/app/certs:ro          # Phase 2 — PKI certificates (read-only)
    depends_on:
      - backend
    profiles:
      - fl

  # ═══════════════════════════════════════════════
  #  5. FL Client A (Bank_A)
  # ═══════════════════════════════════════════════
  fl_client_a:
    build:
      context: ./fl_client
      dockerfile: Dockerfile
    container_name: iot_ids_fl_client_a
    restart: "no"
    environment:
      CLIENT_ID: Bank_A
      FL_SERVER_URL: fl_server:8080
      DATA_PATH: /app/data
      # Phase 2 — mTLS client identity
      FL_CLIENT_CERT: /app/certs/Bank_A.crt
      FL_CLIENT_KEY: /app/certs/Bank_A.key
      FL_CA_CERT: /app/certs/ca.crt
      # Phase 2 — Ed25519 gradient signing key
      CLIENT_SIGNING_KEY: /app/certs/Bank_A_ed25519.pem
    volumes:
      - ./fl_client:/app
      - ./fl_common:/fl_common
      - ./data/clients/bank_a:/app/data:ro
      - ./data/scenarios:/app/scenarios:ro
      - ./model:/app/models:ro
      - ./certs:/app/certs:ro          # Phase 2 — PKI certificates (read-only)
    depends_on:
      - fl_server
    profiles:
      - fl

  # ═══════════════════════════════════════════════
  #  6. FL Client B (Bank_B)
  # ═══════════════════════════════════════════════
  fl_client_b:
    build:
      context: ./fl_client
      dockerfile: Dockerfile
    container_name: iot_ids_fl_client_b
    restart: "no"
    environment:
      CLIENT_ID: Bank_B
      FL_SERVER_URL: fl_server:8080
      DATA_PATH: /app/data
      # Phase 2 — mTLS client identity
      FL_CLIENT_CERT: /app/certs/Bank_B.crt
      FL_CLIENT_KEY: /app/certs/Bank_B.key
      FL_CA_CERT: /app/certs/ca.crt
      # Phase 2 — Ed25519 gradient signing key
      CLIENT_SIGNING_KEY: /app/certs/Bank_B_ed25519.pem
    volumes:
      - ./fl_client:/app
      - ./fl_common:/fl_common
      - ./data/clients/bank_b:/app/data:ro
      - ./data/scenarios:/app/scenarios:ro
      - ./model:/app/models:ro
      - ./certs:/app/certs:ro          # Phase 2 — PKI certificates (read-only)
    depends_on:
      - fl_server
    profiles:
      - fl

  # ═══════════════════════════════════════════════
  #  7. FL Client C (Bank_C)
  # ═══════════════════════════════════════════════
  fl_client_c:
    build:
      context: ./fl_client
      dockerfile: Dockerfile
    container_name: iot_ids_fl_client_c
    restart: "no"
    environment:
      CLIENT_ID: Bank_C
      FL_SERVER_URL: fl_server:8080
      DATA_PATH: /app/data
      # Phase 2 — mTLS client identity
      FL_CLIENT_CERT: /app/certs/Bank_C.crt
      FL_CLIENT_KEY: /app/certs/Bank_C.key
      FL_CA_CERT: /app/certs/ca.crt
      # Phase 2 — Ed25519 gradient signing key
      CLIENT_SIGNING_KEY: /app/certs/Bank_C_ed25519.pem
    volumes:
      - ./fl_client:/app
      - ./fl_common:/fl_common
      - ./data/clients/bank_c:/app/data:ro
      - ./data/scenarios:/app/scenarios:ro
      - ./model:/app/models:ro
      - ./certs:/app/certs:ro          # Phase 2 — PKI certificates (read-only)
    depends_on:
      - fl_server
    profiles:
      - fl

volumes:
  pgdata:
    driver: local

networks:
  default:
    name: iot_ids_network
